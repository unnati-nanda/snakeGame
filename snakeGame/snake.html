<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNAKE GAME</title>

    <style>
      body {
        background-color: #1a1a1a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      canvas {
        border: 4px solid #444;
        background-color: #000;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 2);
      }
    </style>
  </head>
  <body>
    <h1>SNAKE GAME</h1>
    <canvas id="game" width="400" height="400"></canvas>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const gridSize = 20;
      const tileCount = canvas.width / gridSize;

      const snakeParts = [];
      let tailLength = 0;
      let snakeX = 10;
      let snakeY = 10;
      let xv = 1;
      let yv = 0;
      let foodX, foodY;
      moveFood();

      setInterval(game, 500);

      function moveFood() {
        foodX = Math.floor(Math.random() * tileCount);
        foodY = Math.floor(Math.random() * tileCount);
      }
      function game() {
        snakeX += xv;
        snakeY += yv;

        

        if (
          snakeX < 0 ||
          snakeX >= tileCount ||
          snakeY < 0 ||
          snakeY >= tileCount
        ) {
          xv = 0;
          yv = 0;
          snakeX = 10;
          snakeY = 10;
          tailLength=0;
          alert("Game Over! Press ok to restart.");
        }
        if (snakeX === foodX && snakeY === foodY) {
          tailLength++;
          moveFood();
        }
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#FF0000";
        ctx.fillRect(
          foodX * gridSize,
          foodY * gridSize,
          gridSize - 2,
          gridSize - 2,
        );
        ctx.fillStyle = "#00FF00";
        ctx.fillRect(
          snakeX * gridSize,
          snakeY * gridSize,
          gridSize - 2,
          gridSize - 2,
        );
        ctx.fillStyle = "#00FF00";
        for (let i = 0; i < snakeParts.length; i++) {
          let part = snakeParts[i];
          ctx.fillRect(
            part.x * gridSize,
            part.y * gridSize,
            gridSize - 2,
            gridSize - 2,
          );
          if (xv !== 0 || yv !== 0) {
            if (part.x === snakeX && part.y === snakeY) {
              xv = 0;
              yv = 0;
              snakeX = 10;
              snakeY = 10;
              tailLength = 0;
              snakeParts.length = 0;
              moveFood();
              alert("game over ! you bit your own tail.");
              return;
            }
          }
        }

        snakeParts.push({ x: snakeX, y: snakeY });
        while (snakeParts.length > tailLength) {
          snakeParts.shift();
        }
      }
      document.addEventListener("keydown", changeDirection);
      function changeDirection(event) {
        if (event.keyCode === 37 && xv !== 1) {
          xv = -1;
          yv = 0;
        } else if (event.keyCode === 38 && yv !== 1) {
          xv = 0;
          yv = -1;
        } else if (event.keyCode === 39 && xv !== -1) {
          xv = 1;
          yv = 0;
        } else if (event.keyCode === 40 && yv !== -1) {
          xv = 0;
          yv = 1;
        }
      }
    </script>
  </body>
</html>
